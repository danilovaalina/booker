services:
  db:
    image: postgres:17
    container_name: booker_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booker_network
  app:
    build: .
    container_name: booker
    ports:
      - "8081:8081"
    volumes:
      - ./config.yaml:/root/config.yaml # Пробрасываем конфиг внутрь
    env_file:
      - .env
    environment:
      - DB_URL=postgres://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}?sslmode=disable
      - HTTPS_PROXY=socks5://host.docker.internal:1080
      - HTTP_PROXY=socks5://host.docker.internal:1080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - booker_network
volumes:
  postgres_data:

networks:
  booker_network: